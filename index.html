<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiyet Olsun - Yemek Sistemi</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      padding: 15px; 
      background: #f0f2f5; 
      margin: 0; 
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 92vh;
    }
    .card { 
      background: white; 
      width: 100%;
      max-width: 400px; 
      padding: 25px 18px; 
      border-radius: 18px; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
    }
    .logo {
      max-width: 130px;
      max-height: 80px;
      margin-bottom: 8px;
      object-fit: contain;
    }
    .afiyet-baslik {
      font-size: 26px;
      font-weight: 800;
      color: #d93025;
      letter-spacing: 1px;
      margin: 4px 0 8px 0;
    }
    .lokasyon-yazi { 
      color: #1a73e8; 
      margin-top: 0; 
      margin-bottom: 8px;
      font-size: 17px; 
      font-weight: 600;
      background: #e8f0fe;
      padding: 6px 14px;
      border-radius: 8px;
      display: inline-block;
    }
    .tarih-kutu {
      font-size: 14px;
      font-weight: 600;
      color: #3c4043;
      background: #f8f9fa;
      border: 1px solid #dadce0;
      padding: 5px 12px;
      border-radius: 6px;
      margin: 4px auto 10px auto;
      display: inline-block;
    }
    .personel-ad {
      font-size: 18px;
      font-weight: 700;
      color: #202124;
      margin: 6px 0 2px 0;
    }
    p { color: #555; font-size: 14px; margin: 4px 0 10px 0; }
    input { 
      width: 85%; 
      padding: 14px; 
      margin: 12px 0; 
      border: 2px solid #ddd; 
      border-radius: 10px; 
      font-size: 18px; 
      text-align: center; 
      outline: none; 
    }
    input:focus { border-color: #1a73e8; }
    button { 
      background: #1a73e8; 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 15px; 
      font-weight: bold; 
      border-radius: 10px; 
      cursor: pointer; 
      width: 92%; 
    }
    .btn-galeri {
      background: #0f9d58;
      margin-top: 10px;
    }
    .status { 
      font-size: 17px; 
      font-weight: bold; 
      color: #0f9d58; 
      margin-top: 12px; 
      padding: 12px; 
      background: #e6f4ea; 
      border-radius: 10px; 
    }
    .warning { 
      font-size: 15px; 
      font-weight: bold; 
      color: #b06000; 
      margin-top: 12px; 
      padding: 14px; 
      background: #fef7e0; 
      border-radius: 10px; 
    }
    .danger { 
      font-size: 16px; 
      font-weight: bold; 
      color: #c5221f; 
      margin-top: 12px; 
      padding: 15px; 
      background: #fce8e6; 
      border: 1px solid #f6aea9;
      border-radius: 10px; 
    }
    .fis-onizleme {
      width: 85%;
      max-width: 240px;
      margin: 12px auto 4px auto;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      display: none;
    }
    .ios-ipucu {
      font-size: 12px;
      color: #1a73e8;
      font-weight: 600;
      margin-top: 4px;
      display: none;
    }
    .kapanis-not {
      font-size: 13px;
      font-weight: 600;
      color: #5f6368;
      margin-top: 12px;
    }
    .reset { 
      margin-top: 18px; 
      font-size: 12px; 
      color: #999; 
      text-decoration: underline; 
      cursor: pointer; 
      display: inline-block; 
    }
  </style>
</head>
<body>
  <div class="card">
    <img id="sirketLogo" class="logo" src="logo.png" alt="Logo" onerror="this.style.display='none'" />
    
    <div class="afiyet-baslik">AFİYET OLSUN</div>
    <div><span class="lokasyon-yazi" id="lokasyonBaslik">Yükleniyor...</span></div>
    <div><span class="tarih-kutu" id="tarihSaatAlani"></span></div>

    <div id="ilkKurulum" style="display:none;">
      <p>İlk kullanım için tanımlı telefon numaranızı girin:</p>
      <input type="tel" id="telInput" placeholder="05XX XXX XX XX" inputmode="numeric" />
      <button onclick="kaydetVeGonder()">Kaydet ve Gönder</button>
    </div>

    <div id="otomatikEkran" style="display:none;">
      <div class="personel-ad" id="kayitliAdBilgi"></div>
      <p id="kayitliTelBilgi"></p>
      <div class="status" id="durumMesaji">Yetki kontrol ediliyor...</div>
      
      <!-- Ekranda doğrudan basılı tutup galeriye eklenebilen Fiş Görseli -->
      <img id="fisOnizlemeImg" class="fis-onizleme" alt="Yemek İzin Fişi" />
      <div id="iosIpucuYazi" class="ios-ipucu">📲 iPhone: Görsele basılı tutup "Fotoğraflara Ekle" diyebilirsiniz.</div>
      
      <button id="galeriKaydetBtn" class="btn-galeri" style="display:none;" onclick="galeriyeKaydetVeyaIndir()">📸 Fişi Galeriye Kaydet</button>
      <div class="kapanis-not" id="kapanisBilgi"></div>
      <span class="reset" onclick="numaraSifirla()">Farklı Numara Gir</span>
    </div>
  </div>

  <canvas id="fisCanvas" width="600" height="780" style="display:none;"></canvas>

  <script>
    // GOOGLE APPS SCRIPT LİNKİNİZİ BURAYA YAPIŞTIRIN:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUNnt9EevY6YVmt2lDlcMvLIox0pOK5wkbIPa6sEQMv1dOIsgtSjbdFfvZeAuII0KuoA/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const lokasyonAdi = urlParams.get("lokasyon") || "Genel_Lokasyon";
    const temizLokasyon = lokasyonAdi.replace(/_/g, " ");
    document.getElementById("lokasyonBaslik").innerText = temizLokasyon;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    let olusturulanFisDataUrl = null;
    let olusturulanDosyaAdi = "Yemek_Izin_Fisi.png";
    let kapanisSayaci = null;

    function anlikTarihYaz() {
      const simdi = new Date();
      const formatli = simdi.toLocaleDateString("tr-TR") + " " + simdi.toLocaleTimeString("tr-TR");
      document.getElementById("tarihSaatAlani").innerText = "📅 " + formatli;
      return formatli;
    }
    let guncelTarih = anlikTarihYaz();

    function cihazKimligiGetir() {
      let cid = localStorage.getItem("personel_cihaz_id");
      if (!cid) {
        cid = "DEV-" + Date.now() + "-" + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem("personel_cihaz_id", cid);
      }
      return cid;
    }

    const sayfaYenilendiMi = (
      (window.performance && window.performance.navigation && window.performance.navigation.type === 1) ||
      (window.performance && window.performance.getEntriesByType("navigation")[0]?.type === "reload")
    );

    window.onload = function() {
      const kayitliTel = localStorage.getItem("personel_sabit_tel");
      const cihazId = cihazKimligiGetir();
      
      if (kayitliTel) {
        document.getElementById("otomatikEkran").style.display = "block";
        document.getElementById("kayitliTelBilgi").innerText = kayitliTel;

        if (sayfaYenilendiMi || sessionStorage.getItem("oturum_tamamlandi") === "evet") {
          ekraniKilitle("✓ İşleminiz az önce tamamlandı.", "Bu sayfayı kapatabilirsiniz.");
          return;
        }

        veriyiGonder(kayitliTel, cihazId);
      } else {
        document.getElementById("ilkKurulum").style.display = "block";
      }
    };

    function kaydetVeGonder() {
      const hamGirilen = document.getElementById("telInput").value.trim();
      const sadeceRakam = hamGirilen.replace(/\D/g, "");
      if (sadeceRakam.length < 10) {
        alert("Lütfen başında 0 olacak şekilde 11 haneli telefon numaranızı girin (Örn: 05551234567).");
        return;
      }
      const standartTel = "0" + sadeceRakam.slice(-10);
      const cihazId = cihazKimligiGetir();
      
      document.getElementById("ilkKurulum").style.display = "none";
      document.getElementById("otomatikEkran").style.display = "block";
      document.getElementById("kayitliTelBilgi").innerText = standartTel;
      veriyiGonder(standartTel, cihazId);
    }

    function veriyiGonder(telefon, cihazId) {
      const mesajKutusu = document.getElementById("durumMesaji");
      const callbackAdi = "jsonpCallback_" + Math.floor(Math.random() * 1000000);
      
      const zamanAsimi = setTimeout(function() {
        mesajKutusu.className = "warning";
        mesajKutusu.innerText = "Sunucu yanıt vermedi. İnternetinizi kontrol edin.";
      }, 10000);

      window[callbackAdi] = function(data) {
        clearTimeout(zamanAsimi);

        if (data.tarih) {
          guncelTarih = data.tarih;
          document.getElementById("tarihSaatAlani").innerText = "📅 " + data.tarih;
        }
        if (data.adSoyad) {
          document.getElementById("kayitliAdBilgi").innerText = data.adSoyad;
        }

        if (data.durum === "OK") {
          localStorage.setItem("personel_sabit_tel", telefon);
          sessionStorage.setItem("oturum_tamamlandi", "evet");
          
          const fisVerisi = {
            adSoyad: data.adSoyad || "Personel",
            telefon: telefon,
            lokasyon: temizLokasyon,
            tarih: guncelTarih
          };

          ekraniKilitle("✓ " + data.mesaj, "");
          yemekIzinFisiOlustur(fisVerisi);
          geriSayimVeKapat(8); // iOS kullanıcısının görseli kaydedebilmesi için 8 saniye
        } 
        else if (data.durum === "YETKISIZ") {
          localStorage.removeItem("personel_sabit_tel");
          mesajKutusu.className = "danger";
          mesajKutusu.innerText = "⛔ " + data.mesaj;
          document.getElementById("kapanisBilgi").innerText = "Yetkisiz giriş engellendi.";
        } 
        else {
          sessionStorage.setItem("oturum_tamamlandi", "evet");
          mesajKutusu.className = "warning";
          mesajKutusu.innerText = "⚠ " + data.mesaj;
          document.getElementById("kapanisBilgi").innerText = "Günlük yemek hakkınız dolmuştur.";
        }

        delete window[callbackAdi];
        document.body.removeChild(script);
      };

      const script = document.createElement("script");
      script.src = `${SCRIPT_URL}?lokasyon=${encodeURIComponent(lokasyonAdi)}&telefon=${encodeURIComponent(telefon)}&cihazId=${encodeURIComponent(cihazId)}&callback=${callbackAdi}`;
      script.onerror = function() {
        clearTimeout(zamanAsimi);
        mesajKutusu.className = "warning";
        mesajKutusu.innerText = "Bağlantı hatası! Google Script linkini kontrol edin.";
      };
      document.body.appendChild(script);
    }

    function yemekIzinFisiOlustur(bilgi) {
      const canvas = document.getElementById("fisCanvas");
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#1a73e8";
      ctx.lineWidth = 8;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      const cizimiTamamla = function(logoVarMi, logoImg) {
        let yPos = 55;
        ctx.textAlign = "center";

        // 1. Üstte Logo
        if (logoVarMi && logoImg) {
          const oran = Math.min(200 / logoImg.width, 100 / logoImg.height);
          const w = logoImg.width * oran;
          const h = logoImg.height * oran;
          ctx.drawImage(logoImg, (canvas.width - w) / 2, yPos, w, h);
          yPos += h + 45;
        } else {
          yPos += 35;
        }

        // 2. AFİYET OLSUN Başlığı
        ctx.fillStyle = "#d93025";
        ctx.font = "bold 44px Arial, sans-serif";
        ctx.fillText("AFİYET OLSUN", canvas.width / 2, yPos);
        yPos += 34;

        ctx.fillStyle = "#0f9d58";
        ctx.font = "bold 20px Arial, sans-serif";
        ctx.fillText("✓ ONAYLI YEMEK İZİN FİŞİ", canvas.width / 2, yPos);
        yPos += 25;

        ctx.strokeStyle = "#dadce0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(60, yPos);
        ctx.lineTo(canvas.width - 60, yPos);
        ctx.stroke();
        yPos += 48;

        ctx.fillStyle = "#5f6368";
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillText("PERSONEL ADI SOYADI", canvas.width / 2, yPos);
        yPos += 34;
        ctx.fillStyle = "#202124";
        ctx.font = "bold 30px Arial, sans-serif";
        ctx.fillText(bilgi.adSoyad.toUpperCase(), canvas.width / 2, yPos);
        yPos += 52;

        ctx.fillStyle = "#5f6368";
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillText("İLETİŞİM NUMARASI", canvas.width / 2, yPos);
        yPos += 32;
        ctx.fillStyle = "#202124";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.fillText(bilgi.telefon, canvas.width / 2, yPos);
        yPos += 52;

        ctx.fillStyle = "#5f6368";
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillText("LOKASYON", canvas.width / 2, yPos);
        yPos += 32;
        ctx.fillStyle = "#1a73e8";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.fillText(bilgi.lokasyon, canvas.width / 2, yPos);
        yPos += 52;

        ctx.fillStyle = "#5f6368";
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillText("TARİH VE SAAT", canvas.width / 2, yPos);
        yPos += 32;
        ctx.fillStyle = "#202124";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.fillText(bilgi.tarih, canvas.width / 2, yPos);

        ctx.fillStyle = "#80868b";
        ctx.font = "italic 15px Arial, sans-serif";
        ctx.fillText("Günlük tek öğün yemek hakkı için dijital olarak üretilmiştir.", canvas.width / 2, canvas.height - 40);

        olusturulanFisDataUrl = canvas.toDataURL("image/png");
        const dosyaTarih = bilgi.tarih.replace(/[:.\s]/g, "-");
        olusturulanDosyaAdi = `Yemek_Izin_Fisi_${dosyaTarih}.png`;

        // Ekranda görseli göster (iOS basılı tutup Fotoğraflara Ekle diyebilsin)
        const onizlemeImg = document.getElementById("fisOnizlemeImg");
        onizlemeImg.src = olusturulanFisDataUrl;
        onizlemeImg.style.display = "block";
        document.getElementById("galeriKaydetBtn").style.display = "inline-block";

        if (isIOS) {
          document.getElementById("iosIpucuYazi").style.display = "block";
        } else {
          // Android ve Bilgisayarda doğrudan galeri/indirilenler klasörüne indir
          klasikIndir();
        }
      };

      const logoImg = new Image();
      logoImg.crossOrigin = "anonymous";
      logoImg.onload = function() { cizimiTamamla(true, logoImg); };
      logoImg.onerror = function() { cizimiTamamla(false, null); };
      logoImg.src = "logo.png";
    }

    // iOS için yerel Paylaş -> Görüntüyü Kaydet (Galeri) menüsünü açar
    async function galeriyeKaydetVeyaIndir() {
      if (!olusturulanFisDataUrl) return;
      
      // Kullanıcı butona bastıysa kapanış sayacını durdur ki menü kapanmasın
      if (kapanisSayaci) {
        clearInterval(kapanisSayaci);
        document.getElementById("kapanisBilgi").innerText = "Görseli kaydettikten sonra sayfayı kapatabilirsiniz.";
      }

      if (isIOS && navigator.share && navigator.canShare) {
        try {
          const res = await fetch(olusturulanFisDataUrl);
          const blob = await res.blob();
          const file = new File([blob], olusturulanDosyaAdi, { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: "Yemek İzin Fişi"
            });
            return;
          }
        } catch (err) {
          // Paylaşım iptal edilirse klasik indirmeye düş
        }
      }
      klasikIndir();
    }

    function klasikIndir() {
      const link = document.createElement("a");
      link.download = olusturulanDosyaAdi;
      link.href = olusturulanFisDataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function geriSayimVeKapat(saniye) {
      let kalan = saniye;
      const kapanisAlani = document.getElementById("kapanisBilgi");
      kapanisAlani.innerText = "Sayfa " + kalan + " saniye içinde kapanacak...";

      kapanisSayaci = setInterval(function() {
        kalan--;
        if (kalan > 0) {
          kapanisAlani.innerText = "Sayfa " + kalan + " saniye içinde kapanacak...";
        } else {
          clearInterval(kapanisSayaci);
          kapanisAlani.innerText = "Kapatılıyor...";
          window.close();
          setTimeout(function() {
            document.body.innerHTML = "<div style='font-family:sans-serif;text-align:center;padding:50px;'><h2>✓ İşleminiz Tamamlandı</h2><p>Bu sekmeyi kapatabilirsiniz.</p></div>";
          }, 300);
        }
      }, 1000);
    }

    function ekraniKilitle(anaMesaj, altNot) {
      const mesajKutusu = document.getElementById("durumMesaji");
      mesajKutusu.className = "status";
      mesajKutusu.innerText = anaMesaj;
      document.getElementById("kapanisBilgi").innerText = altNot;
    }

    function numaraSifirla() {
      localStorage.removeItem("personel_sabit_tel");
      sessionStorage.removeItem("oturum_tamamlandi");
      location.reload();
    }
  </script>
</body>
</html>
